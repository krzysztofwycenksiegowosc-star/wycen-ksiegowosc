<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sprawdź, czy nie przepłacasz za księgowość. Orientacyjna wycena usług księgowych dla małych firm po KSeF. Porównaj ceny, podejmij świadomą decyzję." />

  <body>

      <input type="text" name="company_type" />
      <input type="text" name="tax_form" />

      <input type="text" name="estimated_range" />

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
